<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Registration - Washroom Platform</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    label { font-weight: bold; margin-top: 10px; display: block; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #004494; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    #status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>Register a Washroom</h2>
  
  <form id="f" novalidate>
    
    <label for="host_category">I am registering as a:</label>
    <select id="host_category">
      <option value="residential">Residential Host (Private Home)</option>
      <option value="commercial">Commercial Host (Shop, Cafe, Petrol Pump)</option>
    </select>

    <div id="business_div" hidden>
      <label for="business_name">Business/Shop Name:</label>
      <input id="business_name" type="text" placeholder="e.g., Sharma Sweets, Highway Cafe">
    </div>

    <label for="name">Your full name:</label>
    <input id="name" type="text" autocomplete="name" required>

    <div class="row">
      <div>
        <label for="phone">Mobile number:</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digits" required>
      </div>
      <div>
        <label for="pin">PIN code:</label>
        <input id="pin" type="text" inputmode="numeric" maxlength="6" required>
      </div>
    </div>

    <label for="addr">Full Address:</label>
    <input id="addr" type="text" required>

    <div class="row">
      <div>
        <label for="price">Price (₹):</label>
        <input id="price" type="number" required>
      </div>
      <div>
        <label for="type">Washroom Type:</label>
        <select id="type">
          <option value="Western">Western</option>
          <option value="Indian">Indian</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="open">Opening Time:</label>
        <input id="open" type="time" required>
      </div>
      <div>
        <label for="close">Closing Time:</label>
        <input id="close" type="time" required>
      </div>
    </div>

    <button type="submit" id="submit-btn">Submit Registration</button>
    <div id="status-msg"></div>

  </form>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Initialize Supabase Connection
    const SUPABASE_URL = 'https://uyypecjfolryxmrxyerj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5eXBlY2pmb2xyeXhtcnh5ZXJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDQ0MzQsImV4cCI6MjEwNjY4MDQzNH0.eKmcvnL_s29ulbi5_lLtMVUL0k2wxPqu-27404yoSTI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const statusMsg = $('status-msg');

    // Toggle business name field
    $('host_category').addEventListener('change', (e) => {$('business_div').hidden = (e.target.value !== 'commercial');
    });

    // Form submission to database
    $('f').addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      const submitBtn = $('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving to database...";
      statusMsg.innerText = "";

      const formData = {
        host_category: $('host_category').value,
        business_name: $('business_name').value.trim(),
        name: $('name').value.trim(),
        phone: $('phone').value.trim(),
        pin: $('pin').value.trim(),
        addr: $('addr').value.trim(),
        price: Number($('price').value),
        type: $('type').value,
        open: $('open').value,
        close: $('close').value
      };

      if (formData.host_category === 'commercial' && formData.business_name.length < 2) {
        statusMsg.innerText = 'Please enter your business or shop name.';
        statusMsg.style.color = 'red';
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Registration";
        return;
      }

      // Insert data into Supabase
      const { data, error } = await supabaseClient
        .from('listings')
        .insert([formData]);

      if (error) {
        statusMsg.innerText = `Error: ${error.message}`;
        statusMsg.style.color = 'red';
        console.error(error);
      } else {
        statusMsg.innerText = "Success! Washroom registered.";
        statusMsg.style.color = 'green';
        $('f').reset();$('business_div').hidden = true;
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Registration";
    });
  </script>

</body>
</html>
