  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Initialize Supabase Connection
    const SUPABASE_URL = 'https://uyypecjfolryxmrxyerj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5eXBlY2pmb2xyeXhtcnh5ZXJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDQ0MzQsImV4cCI6MjEwNjY4MDQzNH0.eKmcvnL_s29ulbi5_lLtMVUL0k2wxPqu-27404yoSTI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const statusMsg = $('status-msg');

    // Toggle business name field
    $('host_category').addEventListener('change', (e) => {$('business_div').hidden = (e.target.value !== 'commercial');
    });

    // Form submission to database
    $('f').addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      const submitBtn = $('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving to database...";
      statusMsg.innerText = "";

      // 1. Fetch the currently logged-in user's secure ID for the host_id column
      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      
      if (authError || !user) {
        statusMsg.innerText = "Error: You must be logged in to register a washroom.";
        statusMsg.style.color = 'red';
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Registration";
        return;
      }

      // 2. Package the form data PLUS the required default database values
      const formData = {
        host_category: $('host_category').value,
        business_name: $('business_name').value.trim(),
        name: $('name').value.trim(),
        phone: $('phone').value.trim(),
        pin: $('pin').value.trim(),
        addr: $('addr').value.trim(),
        price: Number($('price').value),
        type: $('type').value,
        open: $('open').value,
        close: $('close').value,
        
        // --- INJECTING DATA FOR REQUIRED COLUMNS ---
        host_id: user.id,            // The unique Supabase ID of the logged-in host
        who: 'all',                  // Default text
        facilities: [],              // Default empty array for text[]
        kyc_verified: false,         // Default boolean
        status: 'pending'            // Default text
      };

      if (formData.host_category === 'commercial' && formData.business_name.length < 2) {
        statusMsg.innerText = 'Please enter your business or shop name.';
        statusMsg.style.color = 'red';
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Registration";
        return;
      }

      // 3. Insert data into Supabase
      const { data, error } = await supabaseClient
        .from('listings')
        .insert([formData]);

      if (error) {
        statusMsg.innerText = `Error: ${error.message}`;
        statusMsg.style.color = 'red';
        console.error(error);
      } else {
        statusMsg.innerText = "Success! Washroom registered.";
        statusMsg.style.color = 'green';
        $('f').reset();$('business_div').hidden = true;
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Registration";
    });
  </script>
